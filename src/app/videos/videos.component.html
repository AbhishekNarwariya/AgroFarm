<div class="videos-grid">
  <div class="video-card" *ngFor="let video of pagedVideos">
    <div class="video-container">
      <iframe width="100%" height="220" [src]="video | safeUrl" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>
</div>
<div class="pagination-controls">
  <button mat-raised-button color="primary" (click)="prevPage()" [disabled]="page === 1">Prev</button>
  <span>Page {{page}} of {{totalPages}}</span>
  <button mat-raised-button color="primary" (click)="nextPage()" [disabled]="page === totalPages">Next</button>
</div>
