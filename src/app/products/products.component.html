<div class="products-section">
  <h3>Our Products</h3>
  <div class="products-gallery">
    <div class="product-card" *ngFor="let product of pagedProducts">
      <img [src]="product.image" [alt]="product.name" class="product-img" />
      <div class="product-name">{{ product.name }}</div>
    </div>
  </div>
  <div class="pagination-controls" *ngIf="totalPages > 1">
    <button (click)="prevPage()" [disabled]="page === 1">Prev</button>
    <span>Page {{ page }} of {{ totalPages }}</span>
    <button (click)="nextPage()" [disabled]="page === totalPages">Next</button>
  </div>
  <div class="goto-page" *ngIf="totalPages > 1">
    <label for="goto">Go to page:</label>
    <input id="goto" type="number" min="1" [max]="totalPages" [(ngModel)]="page" (change)="setPage(page)" style="width: 50px;" />
  </div>
</div>
