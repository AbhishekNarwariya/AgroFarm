<div class="main-layout">
  <aside class="sidebar" [class.closed]="!sidebarOpen">
    <div class="sidebar-title">Menu</div>
    <a routerLink="/dashboard" routerLinkActive="active"><mat-icon>dashboard</mat-icon> Dashboard</a>
    <a routerLink="/reports" routerLinkActive="active"><mat-icon>bar_chart</mat-icon> Reports</a>
    <a routerLink="/pics" routerLinkActive="active"><mat-icon>image</mat-icon> Pics</a>
    <a routerLink="/videos" routerLinkActive="active"><mat-icon>play_circle</mat-icon> Videos</a>
    <a routerLink="/products" routerLinkActive="active"><mat-icon>shopping_cart</mat-icon> Products</a>
  </aside>
  <div class="main-content">
    <nav class="navbar">
      <div class="nav-left">
        <button class="menu-icon" mat-icon-button (click)="toggleSidebar()">
          <mat-icon>{{ sidebarOpen ? 'menu_open' : 'menu' }}</mat-icon>
        </button>
        <span class="logo">Agrofarm</span>
        <a routerLink="/dashboard" routerLinkActive="active">Home</a>
        <a routerLink="/products" routerLinkActive="active">Products</a>
        <a routerLink="/about" routerLinkActive="active">About</a>
        <a routerLink="/services" routerLinkActive="active">Services</a>
      </div>
      <button (click)="logout()" class="logout-icon" mat-icon-button title="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </nav>
    <div class="dashboard-container">
      <h2>Welcome to the Dashboard!</h2>
      <p>You are now logged in.</p>
    </div>
  </div>
</div>
